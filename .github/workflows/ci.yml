name: CI
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/*.sh install.sh tests/run.sh
      - name: ruff
        run: pipx run ruff check bin tests
      - name: Python compiles
        run: python3 -m py_compile bin/build-dashboard.py tests/test_dashboard.py

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./tests/run.sh
      - name: Quickstart works as written
        run: |
          ATLAS_STATE=examples/state bin/session-start.sh | grep -q "Open missions"
          python3 bin/build-dashboard.py --state examples/state --out "$RUNNER_TEMP/d.html"
          grep -q "Mission control" "$RUNNER_TEMP/d.html"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks, full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -l error .
